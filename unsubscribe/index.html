<!doctype html>
<html lang="en">
  <head>

    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#D8D4CA" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src https://grbywbmbiewrxqbfsxpf.supabase.co; base-uri 'self'; form-action 'none'" />
    <link rel="icon" href="/assets/app-preview/app-icon.png" />
    <title>Unsubscribe | Friendly Trader</title>
    <style>
      @font-face{font-family:"Young Serif";src:url(/assets/fonts/young-serif.woff2) format("woff2");font-weight:400;font-display:swap}
      @font-face{font-family:Figtree;src:url(/assets/fonts/figtree.woff2) format("woff2");font-weight:500 700;font-display:swap}
      html,body{margin:0;background:#D8D4CA;color:#123527}
      body{min-height:100svh;display:flex;flex-direction:column;font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      header{padding:max(16px,env(safe-area-inset-top,0px)) 20px 0}
      header a{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:inherit;text-decoration:none;font-family:"Young Serif",Georgia,serif;font-size:20px}
      header img{width:34px;height:34px;border-radius:26%}
      main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;max-width:34em;margin:0 auto;padding:24px 20px 64px;box-sizing:border-box;width:100%}
      h1{margin:0;font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,56px);line-height:1.06;letter-spacing:-.02em;color:#0A3F2C;text-wrap:balance}
      p{margin:0;font-size:19px;line-height:1.4;font-weight:500;color:#3E4D42}
      button{min-height:56px;margin-top:8px;padding:0 30px;border:0;border-radius:999px;background:#123527;color:#fff;font:700 18px Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
      button:hover{background:#0A2A1D}button:disabled{opacity:.6;cursor:default}
      :focus-visible{outline:3px solid currentColor;outline-offset:3px;border-radius:8px}
      [hidden]{display:none}
    </style>
  </head>
  <body>
    <header><a href="/" aria-label="Friendly Trader home"><img src="/assets/app-preview/app-icon.png" alt="" width="34" height="34" /><span>Friendly Trader</span></a></header>
    <main>
      <h1 id="unsub-title" role="status" aria-live="polite">Stop emails from Friendly Trader?</h1>
      <p id="unsub-line">One tap and you're off the early access list.</p>
      <button id="unsub-go" type="button" hidden>Unsubscribe</button>
      <noscript><p>Turn on JavaScript to unsubscribe here, or use the unsubscribe button your mail app shows at the top of the email.</p></noscript>
    </main>
    <script type="module" src="/assets/early-access/unsubscribe.mjs"></script>
